name: Wheels

on:
  push:
    tags:
    - '*'

jobs:
  build_source:
    name: Build source package
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.x'

      - name: Build source package (.tar.gz)
        run: |
          python -m pip install setuptools
          python setup.py sdist

      - uses: actions/upload-artifact@v6
        with:
          name: source-${{ github.ref_name }}
          path: ./dist/*.tar.gz

  build_python3_wheels:
    name: Build Python 3 wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, ubuntu-22.04-arm, windows-11-arm]

    if: github.actor == 'Legrandin'

    steps:
      - uses: actions/checkout@v6

      - name: Select architecture for MacOS
        run: |
          echo 'CIBW_ARCHS=x86_64 universal2' >> $GITHUB_ENV
        if: runner.os == 'macOS'

      - uses: pypa/cibuildwheel@v3.3.1
        name: Build wheels
        env:
          # cibuildwheel will build wheel once and test it for each CPython version
          # and for PyPy >= 3.10
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-* pp310-* pp311-*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_I686_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_PYPY_X86_64_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_PYPY_I686_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_PYPY_AARCH64_IMAGE: "manylinux2014"
          CIBW_ENABLE: "cpython-freethreading pypy pypy-eol"
          CIBW_BEFORE_TEST_LINUX: "(ldd /bin/ls | grep -q musl && apk add gmp) || true"

          # Set pycryptodome/x test command according to built package
          CIBW_TEST_COMMAND:
            "${{ endsWith(github.ref, 'x') == true &&
            'python -m Cryptodome.SelfTest --skip-slow-tests' ||
            'python -m Crypto.SelfTest --skip-slow-tests' }}"

      - name: Delete manylinux1 wheels
        if: runner.os == 'Linux'
        run: |
          rm -f wheelhouse/*-manylinux1_*.whl

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-python3-${{ matrix.os }}-${{ github.ref_name }}
          overwrite: true
          path: ./wheelhouse/*.whl

  # cibuildwheel 4 builds PyPy 3.11 for the pp80 ABI but it cannot build for Python 3.8,
  # and cibuildwheel 3 builds PyPy 3.11 for the pp73 ABI: we publish wheels for both.
  # This is a separate job because PyPy 7.3 and 8.0 share the same directory in build/.
  build_pypy_pp80_wheels:
    name: Build PyPy 8.0 wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # PyPy is not available for Windows on ARM
        os: [ubuntu-22.04, windows-2022, macos-15, ubuntu-22.04-arm]

    if: github.actor == 'Legrandin'

    steps:
      - uses: actions/checkout@v6

      - uses: pypa/cibuildwheel@v4.3.4
        name: Build wheels
        env:
          CIBW_BUILD: "pp311-*"
          CIBW_ENABLE: "pypy"
          CIBW_ARCHS_MACOS: "x86_64"

          # delvewheel does not know that PyPy 8.0 provides vcruntime140.dll: if vendored,
          # the modules (loaded with cffi or ctypes) cannot find the renamed copy.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --exclude vcruntime140.dll -w {dest_dir} -v {wheel}"

          # Set pycryptodome/x test command according to built package
          CIBW_TEST_COMMAND:
            "${{ endsWith(github.ref, 'x') == true &&
            'python -m Cryptodome.SelfTest --skip-slow-tests' ||
            'python -m Crypto.SelfTest --skip-slow-tests' }}"

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-pypy-pp80-${{ matrix.os }}-${{ github.ref_name }}
          overwrite: true
          path: ./wheelhouse/*.whl

  build_legacy_wheels:
    name: Build legacy Python wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-2022 ]
        arch: [ multi-arch ]
        # Python 2 on Windows requires manual toolchain setup (per-arch) due to newer MSVC used here
        exclude:
          - os: windows-2022
            arch: multi-arch
        include:
          - os: windows-2022
            arch: x86
          - os: windows-2022
            arch: x64

    if: github.actor == 'Legrandin'

    steps:
      - uses: actions/checkout@v6

      - name: Install MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.0
          arch: ${{ matrix.arch }}

      - name: Set Windows build environment variables
        if: runner.os == 'Windows'
        run: |
          echo "DISTUTILS_USE_SDK=1" >> $env:GITHUB_ENV
          echo "MSSdk=1" >> $env:GITHUB_ENV

          if ( '${{ matrix.arch }}' -eq 'x86' )
          {
            echo "CIBW_ARCHS=x86" >> $env:GITHUB_ENV
          }
          else
          {
            echo "CIBW_ARCHS=AMD64" >> $env:GITHUB_ENV
          }

      - uses: pypa/cibuildwheel@v1.12.0
        name: Build wheels
        env:
          CIBW_BUILD: "cp27-* pp27-*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2010"
          CIBW_MANYLINUX_I686_IMAGE: "manylinux2010"
          CIBW_MANYLINUX_PYPY_X86_64_IMAGE: "manylinux2010"
          CIBW_MANYLINUX_PYPY_I686_IMAGE: "manylinux2010"

          # Set pycryptodome/x test command according to built package
          CIBW_TEST_COMMAND:
            "${{ endsWith(github.ref, 'x') == true &&
            'python -m Cryptodome.SelfTest --skip-slow-tests' ||
            'python -m Crypto.SelfTest --skip-slow-tests' }}"

      - name: Delete manylinux1 wheels
        if: runner.os == 'Linux'
        run: |
          rm -f wheelhouse/*-manylinux1_*.whl

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-legacy-${{ matrix.os }}-${{ github.ref_name }}
          overwrite: true
          path: ./wheelhouse/*.whl
