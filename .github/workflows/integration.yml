name: Integration test

on: [push, pull_request]

jobs:
  build_linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        python-version: [ 3.8, 3.9, "3.10", "3.11", "3.12", "3.13", "3.14" ]
        cffi: [ yes, no ]
        include:
          - os: ubuntu-22.04
            python-version: "3.13t"
            cffi: no
          - os: ubuntu-22.04
            python-version: "3.14t"
            cffi: no
          - os: ubuntu-latest
            python-version: pypy3.9
            cffi: no
        exclude:
          - python-version: "3.13t"
            cffi: yes
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install CFFI
      if: matrix.cffi == 'yes'
      run: pip install cffi

    - name: Install dependencies (testing only)
      run: |
        pip install -r requirements-test.txt

    - name: Install package
      run: |
        pip install -v .

    - name: Test
      shell: bash
      run: |
        if [[ -f .separate_namespace ]]; then
          python -m Cryptodome.SelfTest
        else
          python -m Crypto.SelfTest
        fi

  build_desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-15, windows-latest, windows-11-arm ]
        python-version: [ "3.13", "3.14" ]
        cffi: [ yes, no ]
        exclude:
          - os: macos-15
            cffi: no
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install CFFI
      if: matrix.cffi == 'yes'
      run: pip install cffi

    - name: Install dependencies (testing only)
      run: |
        pip install -r requirements-test.txt

    - name: Install package
      run: |
        pip install -v .

    - name: Test
      shell: bash
      run: |
        if [[ -f .separate_namespace ]]; then
          python -m Cryptodome.SelfTest
        else
          python -m Crypto.SelfTest
        fi

  build_linux_arm:
    runs-on: ubuntu-22.04-arm
    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]
        cffi: [ yes ]
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install CFFI
      if: matrix.cffi == 'yes'
      run: pip install cffi

    - name: Install dependencies (testing only)
      run: |
        pip install -r requirements-test.txt

    - name: Install package
      run: |
        pip install -v .

    - name: Test
      shell: bash
      run: |
        if [[ -f .separate_namespace ]]; then
          python -m Cryptodome.SelfTest
        else
          python -m Crypto.SelfTest
        fi

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        pip install mypy -r requirements-test.txt
    - name: Test
      run: |
        mypy lib/

  test_c_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sse: [0, 1]
        arch: [x64, x32]
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libc6-dev-i386 libubsan1
    - name: Test Linux x32 and x64
      run: |
        cd src/test
        mkdir build
        GCC_M32_TOOLCHAIN=${{ github.workspace }}/.github/workflows/gcc_m32_toolchain.txt
        EXTRA=$([ ${{ matrix.arch }} = x32 ] && echo "-DCMAKE_TOOLCHAIN_FILE=$GCC_M32_TOOLCHAIN" || true)
        cmake -B build -DSSE=${{ matrix.sse }} $EXTRA
        make -C build all test

  test_c_windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: win32
          - os: windows-11-arm
            arch: arm64
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python "3.13"
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Test Windows 32 and 64
      run: |
        cd src/test
        mkdir build
        cmake -B build -G "NMake Makefiles"
        cd build
        nmake all test
