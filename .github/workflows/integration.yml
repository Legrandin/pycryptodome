name: Integration test

# Changes that cannot affect the tests do not trigger a run
on:
  push:
    # Branches only: a tag points to a commit that has already been tested
    branches: [ '**' ]
    paths-ignore:
      - 'Changelog.rst'
      - 'AUTHORS.rst'
      - 'INSTALL.rst'
      - 'README.rst'
      - 'Doc/**'
      - '.readthedocs.yaml'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'Changelog.rst'
      - 'AUTHORS.rst'
      - 'INSTALL.rst'
      - 'README.rst'
      - 'Doc/**'
      - '.readthedocs.yaml'
      - '**.md'

permissions:
  contents: read

# One run at a time for the whole repository (all branches, pushes and pull requests):
# each run gets all the runners, and the others wait in a queue, in FIFO order
# (without "queue: max", a new run would cancel the one already waiting)
concurrency:
  group: ${{ github.workflow }}
  queue: max

# Each job has the condition:
#   github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
# so that a pull request from a branch of this repository is not tested twice
# (its push is): only pull requests from forks run on the pull_request event.

jobs:
  # The macOS jobs are the longest ones and they start first. The Linux and Windows jobs
  # wait for the (short) lint jobs, so that they do not take the slots of the macOS jobs:
  # the account runs at most 20 jobs at a time (macOS included).
  build_macos:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ macos-15 ]
        python-version: [ "3.15t", "3.15" ]
        cffi: [ yes, no ]
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}
        cffi: ${{ matrix.cffi }}

    - name: Test
      shell: bash
      run: |
        python -m Crypto.SelfTest

  build_linux:
    needs: [ ruff, mypy ]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
        python-version: [ 3.9, "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t" ]
        cffi: [ yes, no ]
        include:
          - os: ubuntu-24.04
            python-version: pypy3.10
            cffi: yes
          - os: ubuntu-24.04
            python-version: pypy3.11
            cffi: yes
          - os: ubuntu-24.04
            python-version: pypy3.12
            cffi: yes
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}
        cffi: ${{ matrix.cffi }}

    # On x86-64, the big integer code (Crypto.Math._IntegerNat) and the
    # NIST curves and secp256k1 (Crypto.PublicKey._nist_ecc) must use their
    # builds for CPUs with BMI2 and ADX, so that the tests cover them
    - name: Check that the BMI2/ADX build of the big integer code is used
      if: runner.arch == 'X64'
      run: |
        python -c "from Crypto.Math import _IntegerNat as n; import sys; sys.exit(0 if n._bmi2_adx_lib is not None else 'The BMI2/ADX build of Crypto.Math._nat was not loaded')"
        python -c "from Crypto.PublicKey import _nist_ecc as e; import sys; sys.exit(0 if e._bmi2_adx else 'The BMI2/ADX build of Crypto.PublicKey._ec_nat was not loaded')"

    - name: Test
      shell: bash
      run: |
        python -m Crypto.SelfTest

    # The same tests with the portable build of the big integer code (and
    # of the NIST curves)
    # (once, with ctypes: the Python API does not matter here)
    - name: Test the portable build of the big integer code
      if: runner.arch == 'X64' && matrix.python-version == '3.15' && matrix.cffi == 'no'
      shell: bash
      env:
        PYCRYPTODOME_DISABLE_BMI2_ADX: 1
      run: |
        python -c "from Crypto.Math import _IntegerNat as n; import sys; sys.exit(0 if n._lib is n._portable_lib else 'The portable build was not selected')"
        python -c "from Crypto.PublicKey import _nist_ecc as e; import sys; sys.exit(0 if not e._bmi2_adx else 'The portable build of the NIST curves was not selected')"
        python -m Crypto.SelfTest --skip-slow-tests

  build_windows:
    needs: [ ruff, mypy ]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ windows-latest, windows-11-arm ]
        python-version: [ "3.15t", "3.15" ]
        cffi: [ yes, no ]
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}
        cffi: ${{ matrix.cffi }}
        clang-cl: ${{ matrix.os == 'windows-latest' && '1' || '' }}

    - name: Test
      shell: bash
      env:
        # The Windows x86_64 (AMD64) runners support SHA-NI: fail if it is not used
        PYCRYPTODOME_REQUIRE_SHA_NI: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        # Likewise for AVX2, BMI2 and ADX, when built with clang-cl
        PYCRYPTODOME_REQUIRE_AVX2_BMI2: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        # The Windows ARM64 runners support the SHA-512 instructions of ARMv8.2:
        # fail if they are not used (module not built, or CPU feature not detected)
        PYCRYPTODOME_REQUIRE_SHA512_ARMV8: ${{ matrix.os == 'windows-11-arm' && '1' || '' }}
      run: |
        python -m Crypto.SelfTest

  build_linux_arm:
    needs: [ ruff, mypy ]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: [ "3.15t", "3.15" ]
        cffi: [ no, yes ]
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}
        cffi: ${{ matrix.cffi }}

    - name: Test
      shell: bash
      run: |
        python -m Crypto.SelfTest

  ruff:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install ruff
      run: |
        pip install ruff
    - name: Lint
      run: |
        ruff check .
    - name: Check formatting
      run: |
        ruff format --check .

  mypy:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        pip install mypy -r requirements-test.txt
    - name: Test
      run: |
        mypy lib/

  test_c_linux:
    needs: [ ruff, mypy ]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        sse: [0, 1]
        arch: [x64, x32]
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        # i386 packages: Valgrind needs the debug symbols of the 32-bit libc
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install libc6-dev-i386 libubsan1 valgrind libc6-dbg:i386
    - name: Test Linux x32 and x64
      env:
        # On x64, the tests of the BMI2/ADX build of the big integer code
        # must run (they fail instead of skipping on a CPU without them)
        NAT_REQUIRE_BMI2_ADX: ${{ matrix.arch == 'x64' && '1' || '' }}
        # Likewise for the AVX2 build of Salsa20
        SALSA20_REQUIRE_AVX2: ${{ matrix.arch == 'x64' && '1' || '' }}
        CHACHA20_REQUIRE_AVX2: ${{ matrix.arch == 'x64' && '1' || '' }}
        # And for the SHA-NI and AVX2 builds of SLH-DSA
        SLHDSA_REQUIRE_SHA_NI: ${{ matrix.arch == 'x64' && '1' || '' }}
        SLHDSA_REQUIRE_AVX2: ${{ matrix.arch == 'x64' && '1' || '' }}
      run: |
        cd src/test
        mkdir build
        GCC_M32_TOOLCHAIN=${{ github.workspace }}/.github/workflows/gcc_m32_toolchain.txt
        EXTRA=$([ ${{ matrix.arch }} = x32 ] && echo "-DCMAKE_TOOLCHAIN_FILE=$GCC_M32_TOOLCHAIN" || true)
        cmake -B build -DSSE=${{ matrix.sse }} $EXTRA
        make -C build all test

  test_c_linux_arm:
    needs: [ ruff, mypy ]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        # Valgrind: without it, the constant-time tests (*_ct) are skipped
        sudo apt-get install libubsan1 valgrind
    - name: Test Linux ARM64
      env:
        PYTHON: python3
      run: |
        cd src/test
        mkdir build
        cmake -B build
        make -C build all test

  test_c_windows:
    needs: [ ruff, mypy ]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: win32
          - os: windows-11-arm
            arch: arm64
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python "3.15"
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
    - name: Install MSVC
      # A third-party action: pinned to a commit (Dependabot updates it)
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      with:
        arch: ${{ matrix.arch }}
    - name: Test Windows 32 and 64
      env:
        CC: ${{ matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'clang-cl' || 'cl' }}
      run: |
        cd src/test
        mkdir build
        cmake -B build -G "NMake Makefiles"
        cd build
        nmake all test
