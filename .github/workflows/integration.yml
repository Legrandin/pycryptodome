name: Integration test

on: [push, pull_request]

jobs:
  build_linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ 3.9, "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t" ]
        cffi: [ yes, no ]
        include:
          - os: ubuntu-latest
            python-version: pypy3.9
            cffi: yes
          - os: ubuntu-latest
            python-version: pypy3.10
            cffi: yes
          - os: ubuntu-latest
            python-version: pypy3.11
            cffi: yes
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install CFFI
      if: matrix.cffi == 'yes'
      run: pip install cffi

    - name: Install dependencies (testing only)
      run: |
        pip install -r requirements-test.txt

    - name: Install package
      run: |
        pip install -v .

    # On x86-64, the big integer code (Crypto.Math._IntegerNat) must use
    # its build for CPUs with BMI2 and ADX, so that the tests cover it
    - name: Check that the BMI2/ADX build of the big integer code is used
      if: runner.arch == 'X64'
      run: |
        python -c "from Crypto.Math import _IntegerNat as n; import sys; sys.exit(0 if n._bmi2_adx_lib is not None else 'The BMI2/ADX build of Crypto.Math._nat was not loaded')"

    - name: Test
      shell: bash
      run: |
        python -m Crypto.SelfTest

    # The same tests with the portable build of the big integer code
    # (once per Python API: ctypes and cffi)
    - name: Test the portable build of the big integer code
      if: runner.arch == 'X64' && matrix.python-version == '3.14'
      shell: bash
      env:
        PYCRYPTODOME_DISABLE_BMI2_ADX: 1
      run: |
        python -c "from Crypto.Math import _IntegerNat as n; import sys; sys.exit(0 if n._lib is n._portable_lib else 'The portable build was not selected')"
        python -m Crypto.SelfTest --skip-slow-tests

  build_desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-15, windows-latest, windows-11-arm ]
        python-version: [ "3.13", "3.14" ]
        cffi: [ yes, no ]
        exclude:
          - os: macos-15
            cffi: no
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install CFFI
      if: matrix.cffi == 'yes'
      run: pip install cffi

    - name: Install dependencies (testing only)
      run: |
        pip install -r requirements-test.txt

    - name: Install package
      run: |
        pip install -v .

    - name: Test
      shell: bash
      env:
        # The Windows x86_64 (AMD64) runners support SHA-NI: fail if it is not used
        PYCRYPTODOME_REQUIRE_SHA_NI: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      run: |
        python -m Crypto.SelfTest

  build_linux_arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]
        cffi: [ yes ]
    env:
      CFLAGS: "-Wconversion"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install CFFI
      if: matrix.cffi == 'yes'
      run: pip install cffi

    - name: Install dependencies (testing only)
      run: |
        pip install -r requirements-test.txt

    - name: Install package
      run: |
        pip install -v .

    - name: Test
      shell: bash
      run: |
        python -m Crypto.SelfTest

  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install ruff
      run: |
        pip install ruff
    - name: Lint
      run: |
        ruff check .
    - name: Check formatting
      run: |
        ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        pip install mypy -r requirements-test.txt
    - name: Test
      run: |
        mypy lib/

  test_c_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sse: [0, 1]
        arch: [x64, x32]
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        # i386 packages: Valgrind needs the debug symbols of the 32-bit libc
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install libc6-dev-i386 libubsan1 valgrind libc6-dbg:i386
    - name: Test Linux x32 and x64
      env:
        # On x64, the tests of the BMI2/ADX build of the big integer code
        # must run (they fail instead of skipping on a CPU without them)
        NAT_REQUIRE_BMI2_ADX: ${{ matrix.arch == 'x64' && '1' || '' }}
      run: |
        cd src/test
        mkdir build
        GCC_M32_TOOLCHAIN=${{ github.workspace }}/.github/workflows/gcc_m32_toolchain.txt
        EXTRA=$([ ${{ matrix.arch }} = x32 ] && echo "-DCMAKE_TOOLCHAIN_FILE=$GCC_M32_TOOLCHAIN" || true)
        cmake -B build -DSSE=${{ matrix.sse }} $EXTRA
        make -C build all test

  test_c_windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: win32
          - os: windows-11-arm
            arch: arm64
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python "3.14"
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Test Windows 32 and 64
      run: |
        cd src/test
        mkdir build
        cmake -B build -G "NMake Makefiles"
        cd build
        nmake all test
