# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ master, codeql_debug ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '35 8 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The C code is analyzed while it is compiled (see "Build C code" below)
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main
        config-file: ./.github/codeql/codeql-config.yml

    # Not autobuild: it runs "python setup.py build" with the setuptools of the
    # system, which is too old for the license in pyproject.toml (an SPDX
    # expression, which needs setuptools 77 or later)
    - name: Set up Python
      if: matrix.build-mode == 'manual'
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Build C code
      if: matrix.build-mode == 'manual'
      run: |
        python -m pip install "setuptools>=77"
        python setup.py build_ext

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
